---
layout: archive
title: "Publications"
permalink: /publications/
author_profile: true
mathjax: true
---
<hr>

<ol reversed>
{% for post in site.publications reversed %}
  <li style="margin-bottom: 15px;">
    {{ post.citation }}
    <a href="{{ post.paperurl }}" style="color: #9E1B32; text-decoration: underline; border-bottom: none;">[arXiv]</a>
    {% if post.puburl %}
      | <a href="{{ post.puburl }}" style="color: #9E1B32; text-decoration: underline; border-bottom: none;">[Journal]</a>
    {% endif %}
  </li>
{% endfor %}
</ol>

<!-- MathJax Injection script to fix list parsing errors -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
